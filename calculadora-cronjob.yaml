apiVersion: batch/v1
kind: CronJob
metadata:
  name: calculadora-request-logs-cleanup
  namespace: practice-6
  labels:
    app.kubernetes.io/name: calculadora-job
spec:
  schedule: "5 0 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: calculadora-job
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: calculadora-job:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: REQUEST_LOG_FILE
                  value: /app/logs/api-requests.txt
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: request-logs
                  mountPath: /app/logs
          volumes:
            - name: request-logs
              persistentVolumeClaim:
                claimName: calculadora-logs
